# Enable the Niubash shell provider and bash tool for Windows profiles.
- id: pwsh-sandbox
  name: '@deepseek-ai/dsh-pwsh-sandbox'
  disabled: true

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: false

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: true

- insert:
    - id: niu-sandbox
      name: '@cmx666/dsh-niu-sandbox'
      disabled: false
      config:
        niuPath: niu
